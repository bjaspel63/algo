<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algorithm Quest — Student</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div><span class="eyebrow">P4 ICT</span><h1>Algorithm Quest <span>Student</span></h1></div><a href="teacher.html" class="ghost">Teacher Host</a></header>
<main class="wrap"><section id="join" class="panel narrow"><h2>Join Team Challenge</h2><p>Enter the code shown on your teacher's screen.</p><label>Game code<input id="gameCode" maxlength="5" placeholder="ABCDE"></label><label>Your name<input id="studentName" placeholder="Your first name"></label><div class="teamPicker" id="teamPicker"></div><button id="joinBtn" class="primary">Join Game</button><p id="joinMsg" class="muted"></p></section>
<section id="game" class="hidden"><div class="hostbar"><div><span class="eyebrow">TEAM</span><strong id="myTeam">—</strong></div><div><span class="eyebrow">SCORE</span><strong id="myScore">0</strong></div><div><span class="eyebrow">LEVEL</span><strong id="myLevel">Waiting</strong></div></div><section class="panel" id="play"></section></section>
<section id="certificate" class="hidden panel certificate"><p class="eyebrow">ALGORITHM QUEST</p><h2>Certificate of Achievement</h2><p>This certificate is presented to</p><h3 id="certName">Student</h3><p>for completing the Individual Challenge.</p><div class="certScore" id="certScore">0 points</div><button onclick="window.print()" class="primary">Print Certificate</button></section></main>
<script type="module" src="student.js"></script></body></html>
